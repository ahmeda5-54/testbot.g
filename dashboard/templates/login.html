<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
</head>
<body class="login-body">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="login-shell">
    <form class="login-card glass" method="post">
      <div class="logo">V</div>
      <h1>لوحة التحكم</h1>
      <div class="login-brand">Verification Dashboard</div>
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required autofocus>
      <label for="admin_name">اسمك (اختياري — يُسجل في سجل التعديلات)</label>
      <input type="text" id="admin_name" name="admin_name" maxlength="60" placeholder="مثال: أبو أحمد">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <button class="btn pri" type="submit">دخول</button>
    </form>
  </div>
</body>
</html>
